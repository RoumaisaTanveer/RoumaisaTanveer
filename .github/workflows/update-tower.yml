name: Update commit tower

on:
  schedule:
    - cron: '0 0 * * 1'    # every Monday 00:00 UTC
  workflow_dispatch:

jobs:
  build-tower:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tower SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: RoumaisaTanveer
        run: |
          python scripts/generate_tower.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/commit-tower.svg
          git commit -m "chore: update commit tower" || echo "No changes"
          git push
